# Creating the disk/service can incur charges. This file is preparation, not a purchase.
services:
  - type: web
    name: portfolio25-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-lock.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    disk:
      name: portfolio25-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATA_FILE
        value: /var/data/portfolio25/campus.json
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
